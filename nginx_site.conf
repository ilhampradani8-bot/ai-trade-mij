server {
    listen 80;
    server_name ai-trade.mijdigital.my www.ai-trade.mijdigital.my 166.0.112.212 _;

    root /root/ai-trade-2/web-ui/dist;
    index index.html;

    # Serve built static Web UI dashboard instantly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Freqtrade REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
